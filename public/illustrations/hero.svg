<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="540" fill="#fbeee5"/>
  <!-- back wall -->
  <rect x="0" y="0" width="960" height="360" fill="#f3e2d3"/>
  <!-- floor -->
  <rect x="0" y="360" width="960" height="180" fill="#e3c9ae"/>
  <!-- window -->
  <rect x="640" y="60" width="240" height="260" rx="6" fill="#fbeee5" stroke="#c9a184" stroke-width="6"/>
  <line x1="760" y1="60" x2="760" y2="320" stroke="#c9a184" stroke-width="6"/>
  <line x1="640" y1="190" x2="880" y2="190" stroke="#c9a184" stroke-width="6"/>
  <!-- plant -->
  <rect x="70" y="300" width="46" height="60" rx="4" fill="#b9704a"/>
  <circle cx="93" cy="260" r="46" fill="#6f8f5e"/>
  <circle cx="60" cy="280" r="30" fill="#7fa06a"/>
  <circle cx="128" cy="278" r="32" fill="#7fa06a"/>
  <!-- sofa -->
  <rect x="180" y="330" width="340" height="110" rx="18" fill="#ffffff"/>
  <rect x="180" y="300" width="340" height="60" rx="20" fill="#ffffff"/>
  <rect x="190" y="310" width="80" height="50" rx="14" fill="#e8c4ae"/>
  <rect x="290" y="310" width="80" height="50" rx="14" fill="#d18f68"/>
  <rect x="390" y="310" width="80" height="50" rx="14" fill="#e8c4ae"/>
  <rect x="170" y="420" width="20" height="30" rx="4" fill="#c9a184"/>
  <rect x="500" y="420" width="20" height="30" rx="4" fill="#c9a184"/>
  <!-- coffee table -->
  <rect x="240" y="450" width="200" height="16" rx="6" fill="#8a5a3b"/>
  <rect x="255" y="466" width="14" height="40" fill="#8a5a3b"/>
  <rect x="410" y="466" width="14" height="40" fill="#8a5a3b"/>
  <!-- rug -->
  <ellipse cx="340" cy="500" rx="220" ry="26" fill="#d18f68" opacity="0.5"/>
  <!-- shelf with books -->
  <rect x="580" y="360" width="150" height="14" rx="4" fill="#8a5a3b"/>
  <rect x="590" y="330" width="14" height="30" fill="#b9704a"/>
  <rect x="610" y="325" width="14" height="35" fill="#d18f68"/>
  <rect x="630" y="335" width="14" height="25" fill="#6f8f5e"/>
  <rect x="650" y="320" width="14" height="40" fill="#b9704a"/>
  <!-- frame on wall -->
  <rect x="200" y="120" width="120" height="90" rx="4" fill="#ffffff" stroke="#c9a184" stroke-width="6"/>
  <rect x="216" y="136" width="88" height="58" rx="2" fill="#e8c4ae"/>
  <!-- pendant light -->
  <line x1="450" y1="0" x2="450" y2="80" stroke="#8a5a3b" stroke-width="4"/>
  <path d="M420 80 L480 80 L470 110 L430 110 Z" fill="#1a2233"/>
</svg>
