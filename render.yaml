# Render Blueprint. New > Blueprint > pick this repo/branch.
# Free plan = no persistent disk: the SQLite database (firms, leads, edited articles) resets on every
# redeploy and after the service spins down. Fine for testing. For real use, switch to a paid plan and
# uncomment the disk block so DB_PATH survives deploys.
services:
  - type: web
    name: layered
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false   # you will be prompted: the login email(s) allowed to use the blog and verification admin
      # Demo firms are seeded on first start. In production they get a random password unless you set
      # SEED_PASSWORD (use it to log in as a seeded firm). Set SEED_DEMO=0 at launch to skip demo firms.
      # - key: SEED_DEMO
      #   value: "0"
      - key: SITE_URL
        sync: false   # prompted: https://<your-service>.onrender.com (edit later if you add a domain)
      - key: GA_MEASUREMENT_ID
        sync: false   # optional: Google Analytics 4 ID (G-XXXXXXXXXX); analytics stays off if blank
      - key: CONTACT_EMAIL
        sync: false   # public contact address shown on About/Privacy/Terms
    # For real use, uncomment the plan, disk and the two env vars below so the database AND uploaded photos
    # survive deploys (both must live under the disk's mountPath):
    # plan: starter
    # disk:
    #   name: layered-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars to add: DB_PATH=/var/data/app.db  and  UPLOAD_DIR=/var/data/uploads
